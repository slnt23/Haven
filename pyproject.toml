[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "haven"
version = "0.1.0"
description = "多智能体交互框架"
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.6.1",
    "langchain==1.3.1",
    "langchain-core>=1.4.0",
    "langchain-deepseek==1.0.1",
    "langchain-openai==1.2.1",
    "omegaconf==2.3.0",
    "openai==2.36.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7.0",
    "mcp>=1.0.0",
    "langchain-mcp-adapters>=0.1.0",
]

[project.scripts]
haven = "forest.cli.main:main"

#[project.optional-dependencies]
#dev = [
#    "pytest>=8.0.0",
#    "pytest-asyncio>=0.25.0",
#]

[tool.hatch.build.targets.wheel]
packages = ["src/forest"]
include = [
    "src/forest/config/*.yaml",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
