[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "haven"
version = "0.1.0"
description = "个人慢病管理智能体"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
haven = "haven.interface.cli.main:main_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/haven"]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.12.0",
]