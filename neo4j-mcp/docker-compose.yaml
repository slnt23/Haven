

services:
  neo4j-mcp:
    image: mcp/neo4j:latest  # 官方 MCP 镜像[citation:16][citation:17]
    container_name: neo4j-mcp
    restart: unless-stopped
    ports:
      - "8000:8000"  # MCP 服务端口，供客户端连接
    environment:
      # Neo4j 连接配置（使用服务名 neo4j）
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password123
      - NEO4J_DATABASE=neo4j
      # 传输模式：HTTP（供远程客户端连接）
      - NEO4J_TRANSPORT=http
      - NEO4J_MCP_SERVER_HOST=0.0.0.0
      - NEO4J_MCP_SERVER_PORT=8000
      - NEO4J_MCP_SERVER_PATH=/mcp/
      # 安全配置：允许的 Host 和 CORS 来源（按需收紧）
      - NEO4J_MCP_SERVER_ALLOWED_HOSTS=localhost,127.0.0.1,neo4j-mcp
      - NEO4J_MCP_SERVER_ALLOW_ORIGINS=*
      # 可选：只读模式、禁用遥测
      - NEO4J_READ_ONLY=false
      - NEO4J_TELEMETRY=false
    depends_on:
      neo4j:
        condition: service_healthy  # 等待 Neo4j 健康检查通过
    networks:
      - neo4j-net

  # 这里复用之前的 Neo4j 服务定义（或引用外部已存在的 Neo4j）
  neo4j:
    image: neo4j:5.26-community
    container_name: neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_server_default__listen__address=0.0.0.0
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - neo4j-net

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:

networks:
  neo4j-net:
    driver: bridge