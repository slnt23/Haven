# Haven 模型配置（模型选择 + 推理参数）
# 所有参数都在 settings.py 中有默认值兜底；
# 此文件只需写你想覆盖的项。文件缺失或某项留空 → 取代码默认值。

model:
  # 模型名称（MDA 格式 <provider>:<model>），如 deepseek:deepseek-v4-flash
  name: deepseek:deepseek-v4-flash

  # —— 推理参数 ——
  params:
    temperature: 1 # 采样温度（0~2），越高输出越随机、越低越确定
    max_tokens: 4096 # 单次最大输出 token 数（1~128000）
    top_p: 0.9 # 核采样概率阈值（0~1），只从累积概率 top_p 的 token 中采样
    frequency_penalty: 0.3 # 频率惩罚（-2~2），正值抑制已出现 token 的重复
    presence_penalty: 0.1 # 存在惩罚（-2~2），正值抑制已提及话题的再次出现
    timeout: 60.0 # 单次模型请求超时（秒），≥1
    max_retries: 2 # 请求失败重试次数（0~10）
    max_concurrent_requests: 5 # 最大并发请求数（1~100）
    requests_per_minute: 60 # 每分钟最大请求数（0=不限，1~10000）
    rate_limit_check_interval: 0.1 # 限速检查间隔（秒），越小越精确但 CPU 开销越大（0.01~1.0）
