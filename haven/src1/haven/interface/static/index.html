<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Haven - 个人慢病管理智能体</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="/static/favicon.svg"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                50: '#eff6ff',
                100: '#dbeafe',
                200: '#bfdbfe',
                300: '#93c5fd',
                400: '#60a5fa',
                500: '#3b82f6',
                600: '#2563eb',
                700: '#1d4ed8',
              },
            },
          },
        },
      };
    </script>
    <link
      rel="stylesheet"
      href="/static/css/style.css"
    />
  </head>
  <body class="h-screen flex overflow-hidden">
    <!-- Sidebar -->
    <aside class="sidebar w-64 flex-shrink-0 flex flex-col">
      <div class="px-3 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <svg
            class="w-6 h-6 text-primary-500"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" />
          </svg>
          <span class="font-semibold text-lg text-primary-500">Haven</span>
        </div>
      </div>

      <div class="px-3 pb-3">
        <button
          onclick="newChat()"
          class="new-chat-btn w-full rounded-xl px-4 py-2.5 text-sm text-gray-700 flex items-center justify-center gap-2"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 4v16m8-8H4"
            />
          </svg>
          开启新对话
        </button>
      </div>

      <div class="flex-1 overflow-y-auto px-3">
        <div class="text-xs text-gray-400 px-2 py-2">今天</div>
        <div
          id="chat-history"
          class="space-y-0.5"
        ></div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden">
      <!-- Welcome Screen -->
      <div
        id="welcome-screen"
        class="flex-1 flex flex-col items-center justify-center px-4"
      >
        <div class="flex items-center gap-3 mb-6">
          <svg
            class="w-8 h-8 text-primary-500"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" />
          </svg>
          <h1 class="text-2xl font-semibold text-gray-800">今天有什么要记录的？</h1>
        </div>

        <div class="flex items-center gap-2 mb-8">
          <button class="mode-btn active rounded-full px-4 py-1.5 text-sm border border-gray-200 text-gray-600">健康模式</button>
        </div>

        <div class="w-full max-w-2xl">
          <div class="input-area rounded-2xl px-4 py-3">
            <textarea
              id="user-input"
              rows="1"
              placeholder="给 Haven 发送消息"
              class="w-full resize-none bg-transparent text-sm text-gray-700 placeholder-gray-400 focus:outline-none py-1"
              onkeydown="handleKeyDown(event)"
              oninput="autoResize(this)"
            ></textarea>
            <div class="flex items-center justify-between mt-2">
              <!-- 快捷功能按钮 -->
              <div class="flex items-center gap-2">
                <button
                  onclick="showBpModal()"
                  class="quick-action-btn flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-gray-200 text-xs text-gray-600 hover:bg-gray-50 hover:border-gray-300 transition-all"
                >
                  <svg
                    class="w-3.5 h-3.5"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"
                    />
                  </svg>
                  记录血压
                </button>
                <button
                  onclick="sendQuick('血压趋势')"
                  class="quick-action-btn flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-gray-200 text-xs text-gray-600 hover:bg-gray-50 hover:border-gray-300 transition-all"
                >
                  <svg
                    class="w-3.5 h-3.5"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"
                    />
                  </svg>
                  查看趋势
                </button>
                <button
                  onclick="showProfileModal()"
                  class="quick-action-btn flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-gray-200 text-xs text-gray-600 hover:bg-gray-50 hover:border-gray-300 transition-all"
                >
                  <svg
                    class="w-3.5 h-3.5"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
                    />
                  </svg>
                  健康档案
                </button>
              </div>
              <button
                id="send-btn"
                onclick="sendMessage()"
                class="send-btn w-8 h-8 rounded-full flex items-center justify-center text-white disabled:opacity-40 disabled:cursor-not-allowed"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M5 10l7-7m0 0l7 7m-7-7v18"
                  />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Chat Screen (hidden initially) -->
      <div
        id="chat-screen"
        class="flex-1 flex flex-col overflow-hidden hidden"
      >
        <div
          id="chat-messages"
          class="flex-1 overflow-y-auto px-4 py-6 space-y-4"
        ></div>

        <!-- 输入区 -->
        <div class="flex-shrink-0 px-4 pb-4">
          <div class="max-w-2xl mx-auto">
            <div class="input-area rounded-2xl px-4 py-3">
              <textarea
                id="chat-input"
                rows="1"
                placeholder="输入消息..."
                class="w-full resize-none bg-transparent text-sm text-gray-700 placeholder-gray-400 focus:outline-none py-1"
                onkeydown="handleChatKeyDown(event)"
                oninput="autoResize(this)"
              ></textarea>
              <div class="flex items-center justify-between mt-2">
                <!-- 快捷功能按钮 -->
                <div class="flex items-center gap-2">
                  <button
                    onclick="showBpModal()"
                    class="quick-action-btn flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-gray-200 text-xs text-gray-600 hover:bg-gray-50 hover:border-gray-300 transition-all"
                  >
                    <svg
                      class="w-3.5 h-3.5"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"
                      />
                    </svg>
                    记录血压
                  </button>
                  <button
                    onclick="sendQuick('血压趋势')"
                    class="quick-action-btn flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-gray-200 text-xs text-gray-600 hover:bg-gray-50 hover:border-gray-300 transition-all"
                  >
                    <svg
                      class="w-3.5 h-3.5"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"
                      />
                    </svg>
                    查看趋势
                  </button>
                  <button
                    onclick="showProfileModal()"
                    class="quick-action-btn flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-gray-200 text-xs text-gray-600 hover:bg-gray-50 hover:border-gray-300 transition-all"
                  >
                    <svg
                      class="w-3.5 h-3.5"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
                      />
                    </svg>
                    健康档案
                  </button>
                </div>
                <button
                  id="chat-send-btn"
                  onclick="sendChatMessage()"
                  class="send-btn w-8 h-8 rounded-full flex items-center justify-center text-white disabled:opacity-40 disabled:cursor-not-allowed"
                >
                  <svg
                    class="w-4 h-4"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M5 10l7-7m0 0l7 7m-7-7v18"
                    />
                  </svg>
                </button>
              </div>
            </div>
            <p class="text-center text-[11px] text-gray-300 mt-2">Haven 不提供医疗诊断，所有建议仅供参考。紧急情况请拨打 120</p>
          </div>
        </div>
      </div>
    </main>

    <!-- 隐私政策弹窗 -->
    <div
      id="consent-modal"
      class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 modal-overlay"
    >
      <div class="bg-white rounded-2xl p-6 max-w-md w-full mx-4 shadow-xl">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-semibold text-gray-800">隐私政策</h3>
          <button
            onclick="closeConsentModal()"
            class="text-gray-400 hover:text-gray-600"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>
        <div
          id="consent-policy-text"
          class="text-sm text-gray-600 mb-6 max-h-64 overflow-y-auto leading-relaxed"
        >
          加载中...
        </div>
        <div class="flex gap-3">
          <button
            onclick="closeConsentModal()"
            class="flex-1 px-4 py-2.5 border border-gray-200 rounded-xl text-sm text-gray-600 hover:bg-gray-50 transition"
          >
            取消
          </button>
          <button
            id="consent-agree-btn"
            onclick="agreeConsent()"
            class="flex-1 px-4 py-2.5 bg-primary-500 rounded-xl text-sm text-white hover:bg-primary-600 transition"
          >
            同意并继续
          </button>
        </div>
      </div>
    </div>

    <!-- 血压记录弹窗 -->
    <div
      id="bp-modal"
      class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 modal-overlay"
    >
      <div class="bg-white rounded-2xl p-6 max-w-sm w-full mx-4 shadow-xl">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-semibold text-gray-800">记录血压</h3>
          <button
            onclick="closeBpModal()"
            class="text-gray-400 hover:text-gray-600"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>
        <div class="flex items-center gap-3 mb-4">
          <div class="flex-1">
            <label class="text-xs text-gray-500 mb-1 block">收缩压（高压）</label>
            <input
              id="bp-systolic"
              type="number"
              min="60"
              max="300"
              placeholder="120"
              class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-center text-lg font-semibold focus:outline-none focus:border-primary-500 focus:ring-1 focus:ring-primary-500"
            />
          </div>
          <span class="text-gray-300 text-xl mt-5">/</span>
          <div class="flex-1">
            <label class="text-xs text-gray-500 mb-1 block">舒张压（低压）</label>
            <input
              id="bp-diastolic"
              type="number"
              min="30"
              max="200"
              placeholder="80"
              class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-center text-lg font-semibold focus:outline-none focus:border-primary-500 focus:ring-1 focus:ring-primary-500"
            />
          </div>
          <span class="text-gray-400 text-sm mt-5">mmHg</span>
        </div>
        <div
          id="bp-level-hint"
          class="text-xs text-center mb-4"
        ></div>
        <div class="flex gap-3">
          <button
            onclick="closeBpModal()"
            class="flex-1 px-4 py-2.5 border border-gray-200 rounded-xl text-sm text-gray-600 hover:bg-gray-50 transition"
          >
            取消
          </button>
          <button
            onclick="submitBp()"
            class="flex-1 px-4 py-2.5 bg-primary-500 rounded-xl text-sm text-white hover:bg-primary-600 transition"
          >
            确认记录
          </button>
        </div>
        <p class="text-xs text-center text-gray-400 mt-3">💡 也可以直接在对话框说"我血压120/80"</p>
      </div>
    </div>

    <!-- 健康档案弹窗 -->
    <div
      id="profile-modal"
      class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 modal-overlay"
    >
      <div class="bg-white rounded-2xl p-6 max-w-lg w-full mx-4 shadow-xl max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-semibold text-gray-800">健康档案</h3>
          <button
            onclick="closeProfileModal()"
            class="text-gray-400 hover:text-gray-600"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>

        <div class="space-y-3 mb-4">
          <div>
            <label class="text-xs text-gray-500 mb-1 block">性别</label>
            <select
              id="profile-gender"
              class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary-500 focus:ring-1 focus:ring-primary-500"
            >
              <option value="">请选择</option>
              <option value="男">男</option>
              <option value="女">女</option>
            </select>
          </div>

          <div>
            <label class="text-xs text-gray-500 mb-1 block">出生日期</label>
            <input
              id="profile-birth-date"
              type="date"
              class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary-500 focus:ring-1 focus:ring-primary-500"
            />
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs text-gray-500 mb-1 block">身高（cm）</label>
              <input
                id="profile-height"
                type="number"
                min="50"
                max="250"
                placeholder="165"
                class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary-500 focus:ring-1 focus:ring-primary-500"
              />
            </div>
            <div>
              <label class="text-xs text-gray-500 mb-1 block">体重（kg）</label>
              <input
                id="profile-weight"
                type="number"
                min="20"
                max="300"
                placeholder="65"
                class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary-500 focus:ring-1 focus:ring-primary-500"
              />
            </div>
          </div>

          <div>
            <label class="text-xs text-gray-500 mb-1 block">确诊慢病名称</label>
            <input
              id="profile-disease"
              type="text"
              placeholder="如：高血压"
              class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary-500 focus:ring-1 focus:ring-primary-500"
            />
          </div>

          <div>
            <label class="text-xs text-gray-500 mb-1 block">确诊时间</label>
            <input
              id="profile-diagnosed-date"
              type="month"
              class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary-500 focus:ring-1 focus:ring-primary-500"
            />
          </div>

          <div>
            <label class="text-xs text-gray-500 mb-1 block">其他补充信息（选填）</label>
            <textarea
              id="profile-notes"
              rows="2"
              placeholder="如：过敏史、家族病史、用药情况等"
              class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-primary-500 focus:ring-1 focus:ring-primary-500 resize-none"
            ></textarea>
          </div>
        </div>

        <div class="flex gap-3">
          <button
            onclick="closeProfileModal()"
            class="flex-1 px-4 py-2.5 border border-gray-200 rounded-xl text-sm text-gray-600 hover:bg-gray-50 transition"
          >
            取消
          </button>
          <button
            onclick="submitProfile()"
            class="flex-1 px-4 py-2.5 bg-primary-500 rounded-xl text-sm text-white hover:bg-primary-600 transition"
          >
            提交分析
          </button>
        </div>
        <p class="text-xs text-center text-gray-400 mt-3">💡 提交后AI将智能分析您的健康档案</p>
      </div>
    </div>

    <script src="/static/js/app.js"></script>
  </body>
</html>
