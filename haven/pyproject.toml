[project]
name = "haven"
version = "0.0.1"
description = "A Managed Deep Agent project."
requires-python = ">=3.11"
dependencies = [
    "managed-deepagents==0.6.1",
        # 以下四个版本组合是**端到端验证通过**的（含工具注入参数的校验行为）：
        # 升到 langchain 1.4.1 / core 1.6.3 / deepagents 0.7.15 后，注入到工具
        # 的 runtime 参数会重新被 pydantic 校验拦下（报空错误的 "Error invoking
        # tool"）。改动前请先跑通完整闭环。
    "langchain==1.4.0",
    "langchain-core==1.6.2",
    "langgraph==1.2.11",
    "deepagents==0.7.13",
    "langchain-deepseek>=1.1.1,<2.0.0",
        # 上限卡在 <2.1：2.1.x 是 2026-09-24/25 才发布的（0.x→2.1 会移除 2.0 的
        # 一批弃用项）。2.0.52 已带 cp314 轮子，Python 3.14 不需要升到 2.1；
        # 想上 2.1 就把上限改成 <3.0.0 并先跑通闭环。
    "sqlalchemy[asyncio]>=2.0.52,<2.1.0",
    "aiosqlite>=0.22.1",
        # 必须 >=0.31.0：0.30.0 没有 cp314 轮子，Python 3.14 下会退化成源码编译。
    "asyncpg>=0.31.0",
    "pydantic-settings>=2.15.0",
        # 外部 MCP 连接器（connectors/mcp.py）。平台构建清单本来就固定注入这两个
        # 包；在这里显式声明是因为 mda 的连接器*发现*阶段要求项目依赖已安装。
    "langchain-mcp-adapters>=0.3.2",
    "mcp>=1.24.0,<2.0.0",
]
