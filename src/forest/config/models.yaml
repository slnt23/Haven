default_model: deepseek-v4-pro

models:
  deepseek-v4-pro:
    provider: deepseek
    api_key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com
    temperature: 0.5
    max_tokens: 4096

    deepseek-v4-flash:
      provider: deepseek
      api_key_env: DEEPSEEK_API_KEY
      base_url: https://api.deepseek.com
      temperature: 0.7
      max_tokens: 4096

  # 这里下面的作为备选，同时也为国内其他的可以兼容 OpenAi 接口的模型提供示例，
  gpt-4o:
    provider: openai
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1
    temperature: 0.5
    max_tokens: 8192

  gpt-4o-mini:
    provider: openai
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1
    temperature: 0.5
    max_tokens: 4096
  # 通义千问 (Qwen)
  qwen-max:
    provider: aliyun
    api_key_env: DASHSCOPE_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    temperature: 0.7
    max_tokens: 2000

  qwen-plus:
    provider: aliyun
    api_key_env: DASHSCOPE_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    temperature: 0.7
    max_tokens: 2000

