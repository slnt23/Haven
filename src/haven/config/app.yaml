# ==================== Agent Configuration ====================
agent:
  max_iterations: 20
  max_execution_time: 300

# ==================== Web Search ====================
web_search:
  engine: bing

# ==================== RAG ====================
rag:
  embedding_model: text-embedding-3-small
  embedding_api_base: https://api.openai.com/v1
  chunk_size: 1000
  chunk_overlap: 200
  top_k: 5

# ==================== MCP ====================
mcp:
  enabled: true
  # MCP 服务器配置已移至项目根目录下的 mcp.json 文件。
  # 使用标准的 mcpServers 格式，可直接从 MCP 市场复制粘贴。

# ==================== Daemon ====================
daemon:
  channels:
    feishu:
      enabled: true
      app_id: ""
      app_secret: ""

# ==================== Memory ====================
memory:
  db_path: ".data/memory.db"
  enabled: true                              # 是否启用长期记忆（FactStore）
  context_window_tokens: 8000                # pre_model_hook 消息裁剪上限

# ==================== Skills ====================
skill:
  directory: skills
